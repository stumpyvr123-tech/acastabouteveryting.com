<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A cast about everything - Introduction</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            background-image: url("asadal_stock_65.jpg");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            font-family: Titan One, sans-serif;
            text-align: center;
            color: #123047;
        }

        .btn {
            margin: 10px;
            padding: 15px 30px;
            text-align: center;
            text-transform: uppercase;
            transition: 0.5s;
            background-size: 200% auto;
            background-image: linear-gradient(45deg, #2ff5ff 0%, #1de00b 51%, #e2e90d 100%);
            color: #123047;
            border-radius: 10px;
            border: 0;
            font-weight: 700;
            display: inline-block;
            box-shadow: 0 0 14px -7px #f09819;
        }

        .btn:hover {
            background-position: right center;
            color: #123047;
            text-decoration: none;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        /* The button that triggers the dropdown */
        .dropdown-btn {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        /* The dropdown content (hidden by default) */
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            z-index: 1;
            margin-top: 2px;
        }

        /* Links inside the dropdown */
        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        /* Change color of dropdown links on hover */
        .dropdown-content a:hover {
            background-color: #f1f1f1;
        }

        /* Show the dropdown menu when hovering over the button */
        .dropdown:hover .dropdown-content {
            display: block;
        }

        /* Change button color when active */
        .dropdown:hover .dropdown-btn {
            background-color: #0056b3;
        }
    </style>

</head>

<body>
    <h1>Episodes</h1>
    <div class="dropdown">
        <button class="dropdown-btn">Season 3</button>
        <div class="dropdown-content">
            <a href="episodes.html">Season 1</a>
            <a href="s2.html">Season 2</a>


        </div>
    </div>
    <h1>:(</h1>
    <button onclick="window.location = 'index.html'" class="btn">Return</button>
</body>

</html>
