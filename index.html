<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A cast about everything - Introduction</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            background-image: url("asadal_stock_65.jpg");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            font-family: Titan One, sans-serif;
            text-align: center;
            color: #123047;
        }

        .btn {
            margin: 10px;
            padding: 15px 30px;
            text-align: center;
            text-transform: uppercase;
            transition: 0.5s;
            background-size: 200% auto;
            background-image: linear-gradient(45deg, #2ff5ff 0%, #1de00b 51%, #e2e90d 100%);
            color: #123047;
            border-radius: 10px;
            border: 0;
            font-weight: 700;
            display: inline-block;
            box-shadow: 0 0 14px -7px #f09819;
        }

        .btn:hover {
            background-position: right center;
            color: #123047;
            text-decoration: none;
        }

        .btn:active {
            transform: scale(0.95);
        }

</head>

<body>

    <button onclick="window.location = 'mediaplayerfors1e1.html'" class="btn">
        Stream S1 E1 "Some Crude Business" Today FREE OF CHARGE!!</button>
    <button onclick="window.location = 'episodes.html'" class="btn">More Episodes</button>

    <script>
        // Check if the user's browser is smart enough to handle service workers
