<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A cast about everything - Introduction</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            background-image: url("asadal_stock_65.jpg");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            font-family: Titan One, sans-serif;
            text-align: center;
            color: #123047;
        }

        .btn {
            margin: 10px;
            padding: 15px 30px;
            text-align: center;
            text-transform: uppercase;
            transition: 0.5s;
            background-size: 200% auto;
            background-image: linear-gradient(45deg, #2ff5ff 0%, #1de00b 51%, #e2e90d 100%);
            color: #123047;
            border-radius: 10px;
            border: 0;
            font-weight: 700;
            display: inline-block;
            box-shadow: 0 0 14px -7px #f09819;
        }

        .btn:hover {
            background-position: right center;
            color: #123047;
            text-decoration: none;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .button {
            backface-visibility: hidden;
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            text-align: center;
            justify-content: center;
            white-space: nowrap;
            background: linear-gradient(180deg, #ce8 0%, #592 100%);
            border-radius: 20px;
            border: 0.5px solid #8c4;
            border-width: 0.5px 0.5px 0.5px 0.5px;
            padding: 12px 50px 12px 15px;
            box-shadow: inset 0px 1px 0px rgba(255, 255, 255, 0.6), 0px 1px 2px rgba(0, 0, 0, 0.5);
            color: #372;
            font-size: 16px;
            font-family: Helvetica Neue;
            font-weight: 900;
            font-style: normal;
            text-shadow: 0px 1px 0px rgba(255, 255, 255, 0.5)
        }

        .button span {
            color: #372;
            background: #fff;
            border-radius: 20px;
            border: 3px solid #371;
            border-width: 3px 3px 3px 3px;
            padding: 8px 8px 7px 8px;
            margin: 0px 0px 0px 0px;
            position: absolute;
            top: 0px;
            right: 0px;
        }
    </style>

</head>

<body>
    <h1>Welcome to a cast about everything!</h1>
    <p>the name explains itself</p>
    <button onclick="window.location = 'medias1e2'" class="btn">
        Stream S1 E2 "Scratched Up" Today for FREE!</button>
    <button onclick="window.location = 'episodes.html'" class="btn">More Episodes</button>




    <script>
        // Check if the user's browser is smart enough to handle service workers
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Offline System Status: ACTIVE'))
                .catch((err) => console.log('System Error:', err));
        }
    </script>



</body>

</html>
